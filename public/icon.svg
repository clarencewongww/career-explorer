<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Paper ground -->
  <rect width="512" height="512" rx="64" fill="#F4ECD8"/>

  <!-- Riso-pink stamp rotated -->
  <g transform="rotate(5, 256, 256)">
    <rect x="80" y="172" width="352" height="168" rx="8" fill="#FF4D7D"/>
    <text x="256" y="244"
          font-family="Bricolage Grotesque, system-ui, sans-serif"
          font-size="48"
          font-weight="800"
          letter-spacing="4"
          fill="#F4ECD8"
          text-anchor="middle">CAREER</text>
    <text x="256" y="304"
          font-family="Bricolage Grotesque, system-ui, sans-serif"
          font-size="48"
          font-weight="800"
          letter-spacing="4"
          fill="#F4ECD8"
          text-anchor="middle">EXPLORER</text>
  </g>

  <!-- Career emojis scattered around the stamp -->
  <text x="140" y="128" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="44" text-anchor="middle">🛠️</text>
  <text x="372" y="128" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="44" text-anchor="middle">🎨</text>
  <text x="48" y="276" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="44" text-anchor="middle">🤝</text>
  <text x="464" y="276" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="44" text-anchor="middle">💼</text>
  <text x="140" y="432" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="44" text-anchor="middle">🔬</text>
  <text x="372" y="432" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="44" text-anchor="middle">🗂️</text>

  <!-- Riso-blue hashed-square RIASEC mark (bottom-left) -->
  <g transform="translate(72, 380)">
    <rect x="0" y="0" width="60" height="60" rx="4"
          fill="none" stroke="#1FA8FF" stroke-width="5"/>
    <line x1="0" y1="20" x2="60" y2="20" stroke="#1FA8FF" stroke-width="3.5"/>
    <line x1="0" y1="40" x2="60" y2="40" stroke="#1FA8FF" stroke-width="3.5"/>
    <line x1="20" y1="0" x2="20" y2="60" stroke="#1FA8FF" stroke-width="3.5"/>
    <line x1="40" y1="0" x2="40" y2="60" stroke="#1FA8FF" stroke-width="3.5"/>
  </g>
</svg>
